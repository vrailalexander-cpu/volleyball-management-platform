services:
  postgres:
    image: postgres:16-alpine
    container_name: volleyball-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-volleyball_db}
      POSTGRES_USER: ${POSTGRES_USER:-volleyball}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-volleyball_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - volleyball_pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-volleyball} -d ${POSTGRES_DB:-volleyball_db}"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  volleyball_pgdata:
